<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>夢境群島 Dream Islands V0.9</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcf4;font-family:system-ui,"Noto Sans TC",sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#cover{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(35,89,133,.2),rgba(17,54,94,.65));color:white;text-align:center;padding:22px;z-index:8}.panel{width:min(92vw,460px);padding:26px 22px;border:1px solid #ffffff88;border-radius:26px;background:#143554aa;backdrop-filter:blur(12px);box-shadow:0 18px 60px #16486a66}h1{font-size:clamp(30px,7vw,46px);margin:0 0 8px}.sub{line-height:1.7;margin:0 0 20px}button{border:0;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:700;color:#24516d;background:linear-gradient(135deg,#fff4c8,#fff);box-shadow:0 5px 18px #123b5b55;cursor:pointer}
#hint,#status,#travelHint{position:fixed;color:#fff;background:#183d5c99;border:1px solid #ffffff55;border-radius:16px;padding:8px 12px;font-size:12px;z-index:3;pointer-events:none}#hint{top:12px;left:50%;transform:translateX(-50%);white-space:nowrap}#status{right:10px;top:12px}#travelHint{left:50%;bottom:155px;transform:translateX(-50%);display:none;white-space:nowrap}#controls{position:fixed;inset:auto 0 16px;display:none;justify-content:space-between;align-items:end;padding:0 16px;z-index:4;pointer-events:none}.pad{width:116px;height:116px;border-radius:50%;background:#ffffff30;border:1px solid #ffffff88;position:relative;pointer-events:auto;touch-action:none}#stick{position:absolute;width:46px;height:46px;border-radius:50%;background:#fff9;left:34px;top:34px}#rightControls{display:flex;gap:10px;align-items:end;pointer-events:auto}#jump,#travel{width:68px;height:68px;padding:0;background:#fff9;color:#28516b}#travel{display:none;width:76px;height:76px}#tip{font-size:11px;opacity:.9;margin-top:14px}@media(orientation:portrait){#hint:after{content:" · 建議橫向遊玩"}#controls{padding:0 10px}}
</style></head><body>
<div id="game"></div><div id="hint">拖曳畫面旋轉視角 · WASD 移動 · 空白鍵跳躍 · E 旅行</div><div id="status">夢境群島 · 起始花園</div><div id="travelHint">靠近傳送門，按 E 或「旅行」前往下一座島</div>
<div id="controls"><div class="pad" id="pad"><div id="stick"></div></div><div id="rightControls"><button id="travel">旅行</button><button id="jump">跳躍</button></div></div>
<div id="cover"><div class="panel"><h1>夢境群島</h1><p class="sub">V0.9 · 漂浮群島探索版<br>穿越雲海，拜訪四座風格不同的天空島嶼。</p><button id="start">開始探索 ✨</button><div id="tip">首次載入需要網路連線（Three.js）</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),cover=$('cover'),start=$('start'),status=$('status'),travelBtn=$('travel'),travelHint=$('travelHint');
let scene,camera,renderer,player,clock,started=false,yaw=0,pitch=.24,drag=false,lastX=0,lastY=0,vy=0,onGround=true,activeIsland=0,nearPortal=false;
const keys={},touch={x:0,y:0};
const islands=[
 {name:'起始花園',x:0,z:0,color:0x9acb9b,top:0,kind:'garden',portal:0x8deaff},
 {name:'森林花海島',x:-25,z:-17,color:0x79bd91,top:-.5,kind:'forest',portal:0x9cffc5},
 {name:'冰晶雪境島',x:25,z:-17,color:0xc8e6ef,top:-.3,kind:'ice',portal:0x8cecff},
 {name:'夕陽遺跡島',x:0,z:29,color:0xe5bd91,top:-.7,kind:'sunset',portal:0xffc27d}
];
const portals=[];
function mat(c,r=1,extra={}){return new THREE.MeshStandardMaterial({color:c,roughness:r,...extra})}
function add(mesh){scene.add(mesh);return mesh}
function islandBase(d){const g=new THREE.Group();g.position.set(d.x,d.top,d.z);add(g);
 let rock=new THREE.Mesh(new THREE.CylinderGeometry(7.3,8.2,2.5,12),mat(d.kind==='ice'?0x829eaf:d.kind==='sunset'?0x9d806e:0x7c987e));rock.position.y=-1.25;g.add(rock);
 let grass=new THREE.Mesh(new THREE.CylinderGeometry(7.25,7.35,.28,12),mat(d.color));grass.position.y=.08;g.add(grass);
 for(let i=0;i<11;i++){let a=i*Math.PI*2/11,r=6.7+Math.random()*1.2;let b=new THREE.Mesh(new THREE.ConeGeometry(.45+Math.random()*.4,1.8+Math.random(),6),mat(d.kind==='ice'?0xa9c6d5:0x84949a));b.position.set(Math.cos(a)*r,-2.1-Math.random()*.45,Math.sin(a)*r);b.rotation.z=(Math.random()-.5)*.35;g.add(b)}
 return g;}
function tree(x,z,y,s=1,kind='garden'){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.18*s,1.25*s,7),mat(kind==='sunset'?0x8b634b:0x89664e));trunk.position.set(x,y+.62*s,z);add(trunk);
 const color=kind==='forest'?0x4e9d78:kind==='sunset'?0xd98c79:0x5eaa88;let crown=new THREE.Mesh(new THREE.SphereGeometry(.72*s,10,8),mat(color));crown.position.set(x,y+1.48*s,z);add(crown);}
function flower(x,z,y,c){let stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,.32,5),mat(0x57966c));stem.position.set(x,y+.16,z);add(stem);let f=new THREE.Mesh(new THREE.SphereGeometry(.13,7,6),mat(c,.5,{emissive:c,emissiveIntensity:.12}));f.position.set(x,y+.36,z);add(f)}
function crystal(x,y,z,c=0x8cecff,s=1){let m=new THREE.Mesh(new THREE.OctahedronGeometry(.48*s),mat(c,.22,{emissive:c,emissiveIntensity:.35}));m.position.set(x,y,z);add(m);return m}
function cloud(x,y,z,s=1){let g=new THREE.Group();for(let i=0;i<5;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.75*s,10,8),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.76,roughness:1}));m.position.set((i-2)*.58*s,Math.sin(i*1.7)*.16*s,Math.cos(i)*.16*s);g.add(m)}g.position.set(x,y,z);add(g);return g}
function makePortal(d,i){const g=new THREE.Group();g.position.set(d.x,d.top+.18,d.z-4.7);add(g);let base=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.55,.28,24),mat(0x829eae));g.add(base);let ring=new THREE.Mesh(new THREE.TorusGeometry(.95,.12,12,40),mat(d.portal,.25,{emissive:d.portal,emissiveIntensity:.9}));ring.position.y=1.35;g.add(ring);let inner=new THREE.Mesh(new THREE.CircleGeometry(.82,32),new THREE.MeshBasicMaterial({color:d.portal,transparent:true,opacity:.16,side:THREE.DoubleSide}));inner.position.y=1.35;g.add(inner);portals.push({group:g,ring,index:i,x:d.x,z:d.z-4.7,y:d.top});}
function decorate(d,i){let count=d.kind==='forest'?22: d.kind==='garden'?16:10;for(let n=0;n<count;n++){let a=n*2.399,r=2+Math.random()*4.5,x=d.x+Math.cos(a)*r,z=d.z+Math.sin(a)*r;if(d.kind==='garden'||d.kind==='forest'){if(n%3===0)tree(x,z,d.top+.2,.55+Math.random()*.55,d.kind);else flower(x,z,d.top+.2,[0xffe7a6,0xffc7db,0xd8caff,0xffffff][n%4]);}else if(d.kind==='ice'){crystal(x,d.top+.8+Math.random(),z,[0x8cecff,0xb9a7ff,0xffffff][n%3],.65+Math.random()*.55);}else{if(n%3===0)tree(x,z,d.top+.2,.5+Math.random()*.4,'sunset');else flower(x,z,d.top+.2,[0xffd28c,0xff9d91,0xffedc2][n%3]);}}
 if(d.kind==='forest'){let water=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.4,.08,24),mat(0x70d9e8,.25,{emissive:0x2a9eae,emissiveIntensity:.18}));water.position.set(d.x+2,d.top+.25,d.z+1);add(water);let fall=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,2.8,10),new THREE.MeshStandardMaterial({color:0x9cecff,transparent:true,opacity:.65,roughness:.2}));fall.position.set(d.x+2,d.top-1.1,d.z+1);add(fall);}
 if(d.kind==='ice'){for(let n=0;n<5;n++)crystal(d.x-3+n*1.4,d.top+1.1,d.z-1.7,0x9cecff,1.2)}
 if(d.kind==='sunset'){let ruin=mat(0xb88b68);for(let n=0;n<4;n++){let p=new THREE.Mesh(new THREE.BoxGeometry(.45,2.5,.5),ruin);p.position.set(d.x-3+n*1.9,d.top+1.35,d.z+1);add(p)}let lintel=new THREE.Mesh(new THREE.BoxGeometry(6,.4,.7),ruin);lintel.position.set(d.x,d.top+2.65,d.z+1);add(lintel);}
}
function makePlayer(){player=new THREE.Group();const skin=mat(0xffdfc4),cloth=mat(0x557eaa),dark=mat(0x344b67);let head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),skin);head.position.y=1.85;player.add(head);let body=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.75,4,8),cloth);body.position.y=1.05;player.add(body);const limb=new THREE.CapsuleGeometry(.09,.52,3,6);let armL=new THREE.Mesh(limb,skin),armR=new THREE.Mesh(limb,skin),legL=new THREE.Mesh(limb,dark),legR=new THREE.Mesh(limb,dark);armL.position.set(-.34,1.15,0);armR.position.set(.34,1.15,0);legL.position.set(-.14,.42,0);legR.position.set(.14,.42,0);player.add(armL,armR,legL,legR);player.userData={armL,armR,legL,legR};player.position.set(0,0,2.5);add(player)}
function init(){if(typeof THREE==='undefined'){start.textContent='載入失敗，請確認網路後重新整理';return false}scene=new THREE.Scene();scene.background=new THREE.Color(0x9eddf5);scene.fog=new THREE.Fog(0x9eddf5,42,105);camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,180);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe8f8ff,0x7896a3,2));let sun=new THREE.DirectionalLight(0xfff3d7,2.1);sun.position.set(-8,18,10);sun.castShadow=true;scene.add(sun);
 let sea=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x77cbe6));sea.rotation.x=-Math.PI/2;sea.position.y=-13;add(sea);
 islands.forEach((d,i)=>{islandBase(d);decorate(d,i);makePortal(d,i)});
 for(let i=0;i<28;i++)cloud(-48+i*3.6,11+(i%4)*1.8,-42-(i%5)*8,.75+Math.random()*.65);
 makePlayer();clock=new THREE.Clock();animate();return true}
function travel(){if(!nearPortal)return;activeIsland=(activeIsland+1)%islands.length;let d=islands[activeIsland];player.position.set(d.x,d.top+.08,d.z+2.5);vy=0;onGround=true;status.textContent='夢境群島 · '+d.name;nearPortal=false;travelBtn.style.display='none';travelHint.style.display='none';yaw=0;}
function animate(){requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;if(started&&player){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-touch.y;let s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+touch.x;let moving=Math.abs(f)+Math.abs(s)>.08;let dir=new THREE.Vector3(s,0,-f);if(dir.length()>1)dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.addScaledVector(dir,dt*5);if(moving){player.rotation.y=Math.atan2(dir.x,dir.z);let swing=Math.sin(t*10)*.62;player.userData.armL.rotation.x=swing;player.userData.armR.rotation.x=-swing;player.userData.legL.rotation.x=-swing;player.userData.legR.rotation.x=swing}else Object.values(player.userData).forEach(o=>o.rotation.x*=.78);
 vy-=12*dt;player.position.y+=vy*dt;let d=islands[activeIsland],dx=player.position.x-d.x,dz=player.position.z-d.z;if(Math.hypot(dx,dz)<7.1&&player.position.y<=d.top){player.position.y=d.top;vy=0;onGround=true}else if(player.position.y<d.top-7){player.position.set(d.x,d.top+.1,d.z+2.5);vy=0;onGround=true}
 let portal=portals[activeIsland],dist=Math.hypot(player.position.x-portal.x,player.position.z-portal.z);nearPortal=dist<2.8&&Math.abs(player.position.y-d.top)<2;travelBtn.style.display=nearPortal?'block':'none';travelHint.style.display=nearPortal?'block':'none';
 if(keys.Space&&onGround){vy=6;onGround=false}let target=new THREE.Vector3(player.position.x,player.position.y+1.05,player.position.z),distCam=9,cp=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*distCam*cp,target.y+Math.sin(pitch)*distCam+2,target.z+Math.cos(yaw)*distCam*cp);camera.lookAt(target)}
 portals.forEach(p=>{p.ring.rotation.y=t*.65;p.group.position.y=islands[p.index].top+.18+Math.sin(t*1.5+p.index)*.08});renderer.render(scene,camera)}
start.addEventListener('click',()=>{if(!renderer){if(!init())return}started=true;cover.style.display='none';$('controls').style.display='flex'});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyE')travel()});window.addEventListener('keyup',e=>keys[e.code]=false);
$('game').addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;$('game').setPointerCapture(e.pointerId)});$('game').addEventListener('pointermove',e=>{if(!drag||!started)return;yaw-=(e.clientX-lastX)*.006;pitch=Math.max(-.15,Math.min(.8,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});$('game').addEventListener('pointerup',()=>drag=false);$('game').addEventListener('pointercancel',()=>drag=false);
 $('jump').addEventListener('click',()=>{if(onGround){vy=6;onGround=false}});travelBtn.addEventListener('click',travel);
 const pad=$('pad'),stick=$('stick');let rect;pad.addEventListener('pointerdown',e=>{rect=pad.getBoundingClientRect();pad.setPointerCapture(e.pointerId);movePad(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)movePad(e)});function movePad(e){let cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=36;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;touch.x=dx/max;touch.y=dy/max}function reset(){touch.x=touch.y=0;stick.style.transform='translate(0,0)'}pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);
 window.addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
})();
</script></body></html>
