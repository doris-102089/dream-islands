<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>夢境群島｜場景升級版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8e2f4;font-family:system-ui,"Noto Sans TC",sans-serif}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#fff;background:#183d5c88;border:1px solid #ffffff55;border-radius:18px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none}
#status{position:fixed;right:12px;top:12px;color:#fff;background:#183d5c88;padding:7px 11px;border-radius:15px;font-size:12px;z-index:2}
#controls{position:fixed;inset:auto 0 18px;display:flex;justify-content:space-between;align-items:end;padding:0 22px;z-index:3;pointer-events:none}
.pad{width:122px;height:122px;border-radius:50%;background:#ffffff30;border:1px solid #ffffff80;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff9;left:36px;top:36px}
button{border:0;border-radius:999px;font-size:18px;font-weight:800;color:#28516b;background:#fff9;box-shadow:0 5px 18px #123b5b33;touch-action:manipulation}
#jump{pointer-events:auto;width:88px;height:88px}
#home{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:4;padding:8px 13px;font-size:13px;display:none}
#cover{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(57,132,169,.18),rgba(17,54,94,.58));color:white;text-align:center;padding:24px;z-index:5}
.panel{width:min(92vw,440px);padding:28px 22px;border:1px solid #ffffff88;border-radius:26px;background:#14375499;backdrop-filter:blur(12px);box-shadow:0 18px 60px #16486a55}
h1{font-size:clamp(30px,7vw,46px);margin:0 0 8px;letter-spacing:2px}.sub{opacity:.95;line-height:1.8;margin:0 0 22px}
#start{padding:13px 25px;background:linear-gradient(135deg,#fff4c8,#fff);font-size:17px}
@media(orientation:portrait){#hint{max-width:78vw;white-space:normal;text-align:center;font-size:11px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hint">拖曳畫面轉動視角 · 左下搖桿移動 · 右下跳躍</div>
<div id="status">夢境群島 · 星光廣場</div>
<button id="home">回到星光廣場</button>
<div id="controls"><div class="pad" id="pad"><div id="stick"></div></div><button id="jump">跳躍</button></div>
<div id="cover"><div class="panel"><h1>夢境群島</h1><p class="sub">穿過雲海，沿著石橋探索五座天空島嶼。<br>森林、花海、瀑布與古老遺跡正在等你。</p><button id="start">開始探索 ✨</button><p style="font-size:12px;opacity:.8;margin:16px 0 0">首次載入需要網路連線</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
(()=>{
const $=id=>document.getElementById(id);
const cover=$('cover'),start=$('start'),status=$('status'),home=$('home');
let scene,camera,renderer,player,clock,started=false,yaw=0,pitch=.22,drag=false,lastX=0,lastY=0,vy=0,onGround=true;
const keys={},touch={x:0,y:0};let islands=[];
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function add(mesh,parent=scene){parent.add(mesh);mesh.castShadow=true;mesh.receiveShadow=true;return mesh}
function island(x,z,r,color,name){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const n=12,pts=[];for(let i=0;i<n;i++){let a=i/n*Math.PI*2,rr=r*(.88+.12*Math.sin(i*7.3+x*.3));pts.push(new THREE.Vector2(Math.cos(a)*rr,Math.sin(a)*rr))}
 const shape=new THREE.Shape();shape.moveTo(pts[0].x,pts[0].y);for(let i=1;i<n;i++)shape.lineTo(pts[i].x,pts[i].y);shape.closePath();
 const rockGeo=new THREE.ExtrudeGeometry(shape,{depth:2.5,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.35,bevelThickness:.3});
 rockGeo.rotateX(Math.PI/2);
 const rock=add(new THREE.Mesh(rockGeo,mat(0x829ba5)),g);rock.position.y=-.15;
 const top=add(new THREE.Mesh(new THREE.CylinderGeometry(r*.9,r*.94,.32,12),mat(color)),g);top.position.y=.04;
 // soft grassy edge
 const rim=add(new THREE.Mesh(new THREE.TorusGeometry(r*.88,.13,6,48),mat(0xc1e7b0)),g);rim.rotation.x=Math.PI/2;rim.position.y=.22;
 islands.push({x,z,r,name});
 return g;
}
function tree(parent,x,z,s=1,c=0x438c70){
 const trunk=add(new THREE.Mesh(new THREE.CylinderGeometry(.13*s,.2*s,1.25*s,7),mat(0x795b48)),parent);trunk.position.set(x,.78*s,z);
 for(let j=0;j<3;j++){let crown=add(new THREE.Mesh(new THREE.SphereGeometry((.68-j*.08)*s,10,8),mat(c+j*0x030900)),parent);crown.position.set(x,(1.48+j*.3)*s,z);crown.scale.set(1,1.1,1)}
}
function flower(parent,x,z,c){
 const stem=add(new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,.35,5),mat(0x57946b)),parent);stem.position.set(x,.34,z);
 const bloom=add(new THREE.Mesh(new THREE.SphereGeometry(.16,8,7),mat(c)),parent);bloom.position.set(x,.55,z);bloom.scale.y=.65;
}
function rock(parent,x,z,s=1){
 let m=add(new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),mat(0x9aa9ad)),parent);m.position.set(x,.35*s,z);m.rotation.set(.2,.5,.1);
}
function crystal(parent,x,z,c){
 let m=add(new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.22,roughness:.25})),parent);m.position.set(x,.8,z);m.rotation.y=.4;
}
function lamp(parent,x,z){
 let p=add(new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,1.3,8),mat(0x79634d)),parent);p.position.set(x,.65,z);
 let l=add(new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),new THREE.MeshStandardMaterial({color:0xffe6a0,emissive:0xffc45a,emissiveIntensity:.8})),parent);l.position.set(x,1.42,z);
}
function bridge(ax,az,bx,bz){
 const dx=bx-ax,dz=bz-az,len=Math.hypot(dx,dz),angle=Math.atan2(-dz,dx),g=new THREE.Group();g.position.set((ax+bx)/2,.08,(az+bz)/2);g.rotation.y=angle;scene.add(g);
 const count=Math.floor(len/.85);
 for(let i=0;i<count;i++){let x=-len/2+(i+.5)*len/count;let plank=add(new THREE.Mesh(new THREE.BoxGeometry(len/count-.06,.18,2.35),mat(i%2?0x9b8064:0xb49370)),g);plank.position.set(x,0,0)}
 for(let side of [-1,1]){
  let rail=add(new THREE.Mesh(new THREE.BoxGeometry(len,.16,.16),mat(0x806b59)),g);rail.position.set(0,.68,side*1.08);
  for(let i=0;i<=count;i++){let post=add(new THREE.Mesh(new THREE.BoxGeometry(.16,.72,.16),mat(0x806b59)),g);post.position.set(-len/2+i*len/count,.34,side*1.08)}
 }
}
function cloud(x,y,z,s=1){let g=new THREE.Group();for(let i=0;i<5;i++){let m=add(new THREE.Mesh(new THREE.SphereGeometry(.8*s,10,8),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.7,roughness:1})),g);m.position.set((i-2)*.7*s,Math.sin(i*1.6)*.18*s,Math.cos(i)*.16*s)}g.position.set(x,y,z);scene.add(g)}
function buildWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0xa8e2f4);scene.fog=new THREE.Fog(0xa8e2f4,55,115);
 camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;$('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xe9f8ff,0x78949a,2.1));
 let sun=new THREE.DirectionalLight(0xfff0d1,2.1);sun.position.set(-18,30,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 let sea=add(new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x75cce5)));sea.rotation.x=-Math.PI/2;sea.position.y=-12;
 // Five islands arranged around a central hub
 let hub=island(0,0,9,0x91c99b,'星光廣場');
 let forest=island(-24,-1,8,0x83bd91,'晨霧森林');
 let garden=island(0,-25,8,0xd9b4d2,'夢幻花園');
 let falls=island(24,-1,8,0x83c9ce,'月光瀑布');
 let ruins=island(0,24,8,0xc9b99e,'古老遺跡');
 bridge(-8,0,-16,0);bridge(0,-8,0,-17);bridge(8,0,16,0);bridge(0,8,0,17);
 // central plaza
 for(let i=0;i<8;i++){let a=i*Math.PI/4;let x=Math.cos(a)*5.7,z=Math.sin(a)*5.7;tree(hub,x,z,.72,0x579d83)}
 crystal(hub,-2,0,0x9cecff);crystal(hub,2,1,0xffd58e);lamp(hub,0,-4);lamp(hub,0,4);
 // forest island: layered trees, rocks and path
 for(let i=0;i<18;i++){let a=i*2.399,r=2+Math.sqrt(i%9)*1.45;tree(forest,Math.cos(a)*r,Math.sin(a)*r,.75+(i%3)*.16,i%2?0x478d68:0x5b9c76)}
 for(let i=0;i<9;i++)rock(forest,Math.sin(i*4)*5,Math.cos(i*3)*5,.45+(i%3)*.2);
 // flower garden
 for(let i=0;i<56;i++){let a=i*2.4,r=1.3+(i%7)*.82;flower(garden,Math.cos(a)*r,Math.sin(a)*r,[0xffe59c,0xffb8d2,0xc8b7ff,0xffffff][i%4])}
 for(let i=0;i<4;i++)crystal(garden,Math.cos(i*Math.PI/2)*4,Math.sin(i*Math.PI/2)*4,0xc8b7ff);
 // waterfall island: cliff face, water ribbons and pool
 for(let i=0;i<5;i++){let m=add(new THREE.Mesh(new THREE.BoxGeometry(.8,5.5,.32),new THREE.MeshStandardMaterial({color:0x80dff2,transparent:true,opacity:.78,metalness:.12,roughness:.2})),falls);m.position.set(-3+i*1.45,-2.5,-6.5);m.rotation.z=(i-2)*.045}
 let pool=add(new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.4,.18,24),mat(0x75d8e8,.25)),falls);pool.position.set(0,.28,-5.6);
 for(let i=0;i<6;i++)rock(falls,Math.cos(i)*5,Math.sin(i)*5,.55);
 crystal(falls,0,1,0x83eaff);
 // ruins island: stone columns, broken arches and lanterns
 for(let i=0;i<8;i++){let a=i*Math.PI/4,x=Math.cos(a)*4.8,z=Math.sin(a)*4.8;let col=add(new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,3.4,8),mat(0xb4a58c)),ruins);col.position.set(x,1.7,z);let cap=add(new THREE.Mesh(new THREE.BoxGeometry(1.05,.25,1.05),mat(0xd4c4a5)),ruins);cap.position.set(x,3.45,z);lamp(ruins,x*.65,z*.65)}
 let altar=add(new THREE.Mesh(new THREE.CylinderGeometry(2,2.3,.5,12),mat(0x9e927e)),ruins);altar.position.y=.3;crystal(ruins,0,1.1,0xffd58e);
 // floating clouds and distant islets
 for(let i=0;i<18;i++)cloud(-45+(i%9)*11,10+(i%4)*2,-38-Math.floor(i/9)*28,.7+(i%3)*.18);
 for(let i=0;i<14;i++){let a=i*Math.PI*2/14,r=55;let b=add(new THREE.Mesh(new THREE.DodecahedronGeometry(1.8+(i%3),1),mat(0xb6d4dc)),scene);b.position.set(Math.cos(a)*r,-2+(i%4),Math.sin(a)*r)}
 // player
 player=new THREE.Group();let skin=mat(0xffdfc4),cloth=mat(0x416d9b),dark=mat(0x263c56);
 let head=add(new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),skin),player);head.position.y=1.85;
 let body=add(new THREE.Mesh(new THREE.CapsuleGeometry(.22,.75,4,8),cloth),player);body.position.y=1.05;
 let limb=new THREE.CapsuleGeometry(.09,.52,3,6),armL=add(new THREE.Mesh(limb,skin),player),armR=add(new THREE.Mesh(limb,skin),player),legL=add(new THREE.Mesh(limb,dark),player),legR=add(new THREE.Mesh(limb,dark),player);
 armL.position.set(-.34,1.15,0);armR.position.set(.34,1.15,0);legL.position.set(-.14,.42,0);legR.position.set(.14,.42,0);player.userData={armL,armR,legL,legR};player.position.set(0,0,3);scene.add(player);
 clock=new THREE.Clock();animate();
}
function updateStatus(){let best=islands[0],d=1e9;for(let i of islands){let q=Math.hypot(player.position.x-i.x,player.position.z-i.z);if(q<d){d=q;best=i}}status.textContent='夢境群島 · '+best.name}
function animate(){requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 if(started&&player){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-touch.y,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+touch.x;let moving=Math.abs(f)+Math.abs(s)>.08;let dir=new THREE.Vector3(s,0,-f);if(dir.length()>1)dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.addScaledVector(dir,dt*5);player.position.x=THREE.MathUtils.clamp(player.position.x,-33,33);player.position.z=THREE.MathUtils.clamp(player.position.z,-33,33);
 if(moving){player.rotation.y=Math.atan2(dir.x,dir.z);let sw=Math.sin(t*10)*.62;player.userData.armL.rotation.x=sw;player.userData.armR.rotation.x=-sw;player.userData.legL.rotation.x=-sw;player.userData.legR.rotation.x=sw}else Object.values(player.userData).forEach(o=>o.rotation.x*=.78);
 vy-=12*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
 let target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z),dist=9,cp=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*dist*cp,target.y+Math.sin(pitch)*dist+2,target.z+Math.cos(yaw)*dist*cp);camera.lookAt(target);updateStatus()}
 scene.traverse(o=>{if(o.geometry&&o.geometry.type==='TorusGeometry')o.rotation.z=t*.18});renderer.render(scene,camera)}
function startGame(){if(!renderer)buildWorld();started=true;cover.style.display='none';home.style.display='block'}
start.addEventListener('click',startGame);
home.addEventListener('click',()=>{player.position.set(0,0,3);yaw=0;pitch=.22});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);
$('game').addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;$('game').setPointerCapture(e.pointerId)});
$('game').addEventListener('pointermove',e=>{if(!drag||!started)return;yaw-=(e.clientX-lastX)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.004,-.12,.8);lastX=e.clientX;lastY=e.clientY});
$('game').addEventListener('pointerup',()=>drag=false);$('game').addEventListener('pointercancel',()=>drag=false);
$('jump').addEventListener('click',()=>{if(onGround){vy=6;onGround=false}});
let pad=$('pad'),stick=$('stick'),rect;pad.addEventListener('pointerdown',e=>{rect=pad.getBoundingClientRect();pad.setPointerCapture(e.pointerId);movePad(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)movePad(e)});
function movePad(e){let dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2),len=Math.hypot(dx,dy),max=38;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;touch.x=dx/max;touch.y=dy/max}
function reset(){touch.x=touch.y=0;stick.style.transform='translate(0,0)'}pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);
window.addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
})();
</script>
</body></html>
