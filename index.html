let ambienceContext=null,ambienceOn=false,ambienceMaster=null,ambienceLayers={},ambienceStarted=false,lastAmbienceScene='';
function makeNoiseLayer(ctx,kind,volume,cutoff){
 const buffer=ctx.createBuffer(1,ctx.sampleRate*5,ctx.sampleRate),data=buffer.getChannelData(0);
 let last=0;for(let i=0;i<data.length;i++){const white=Math.random()*2-1;last=last*.94+white*.06;data[i]=kind==='pink'?last*3.2:white*.72;}
 const src=ctx.createBufferSource();src.buffer=buffer;src.loop=true;
 const filter=ctx.createBiquadFilter();filter.type=kind==='water'?'bandpass':(kind==='high'?'highpass':'lowpass');filter.frequency.value=cutoff;filter.Q.value=kind==='water'?.8:.45;
 const gain=ctx.createGain();gain.gain.value=0;src.connect(filter);filter.connect(gain);gain.connect(ambienceMaster);src.start();
 return {gain,src,filter,base:volume};
}
function makeTone(ctx,freq,type,volume){
 const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.value=0;osc.connect(gain);gain.connect(ambienceMaster);osc.start();return {osc,gain,base:volume};
}
function startAmbience(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC){ambienceButton.textContent='此瀏覽器不支援音效';return false;}
 ambienceContext=new AC();ambienceMaster=ambienceContext.createGain();ambienceMaster.gain.value=0;ambienceMaster.connect(ambienceContext.destination);
 // Separate sound layers: wind, rushing water, insects, cave resonance and crystal shimmer.
 ambienceLayers.wind=makeNoiseLayer(ambienceContext,'pink',.23,620);
 ambienceLayers.water=makeNoiseLayer(ambienceContext,'water',.72,920);
 ambienceLayers.waterLow=makeNoiseLayer(ambienceContext,'pink',.38,360);
 ambienceLayers.insects=makeNoiseLayer(ambienceContext,'high',.22,3100);
 ambienceLayers.hum=makeTone(ambienceContext,86,'sine',.16);
 ambienceLayers.crystal=makeTone(ambienceContext,392,'sine',.11);
 ambienceLayers.chime=makeTone(ambienceContext,660,'triangle',.08);
 ambienceLayers.bird=makeTone(ambienceContext,1180,'sine',.035);
 const t=ambienceContext.currentTime;
 // Gentle independent modulation makes the soundscape move rather than stay flat.
 const lfo=ambienceContext.createOscillator(),lfoGain=ambienceContext.createGain();lfo.frequency.value=.13;lfoGain.gain.value=170;lfo.connect(lfoGain);lfoGain.connect(ambienceLayers.water.filter.frequency);lfo.start();
 const windLfo=ambienceContext.createOscillator(),windGain=ambienceContext.createGain();windLfo.frequency.value=.07;windGain.gain.value=.09;windLfo.connect(windGain);windGain.connect(ambienceLayers.wind.gain);windLfo.start();
 ambienceStarted=true;return true;
}
function setAmbienceScene(x,z){
 if(!ambienceStarted||!ambienceOn)return;
 const waterfall=Math.hypot(x-cliffX,z-cliffZ)<95;
 const garden=Math.hypot(x+245,z+235)<105;
 const cave=Math.hypot(x-275,z-225)<90;
 const harbor=Math.hypot(x-275,z+235)<110;
 const city=Math.hypot(x-cityX,z-cityZ)<112;
 const sceneKey=city?'city':waterfall?'waterfall':garden?'garden':cave?'cave':harbor?'harbor':'meadow';
 if(sceneKey===lastAmbienceScene)return;lastAmbienceScene=sceneKey;
 const t=ambienceContext.currentTime;
 const profile=waterfall?{wind:.20,water:.95,waterLow:.82,insects:.04,hum:.04,crystal:.02,chime:.04,bird:.01}
 :garden?{wind:.48,water:.08,waterLow:.04,insects:.78,hum:.04,crystal:.10,chime:.42,bird:.08}
 :cave?{wind:.04,water:.18,waterLow:.12,insects:.01,hum:.92,crystal:.82,chime:.38,bird:0}
 :harbor?{wind:.30,water:.92,waterLow:.68,insects:.18,hum:.06,crystal:.08,chime:.20,bird:.72}
 :city?{wind:.12,water:.32,waterLow:.18,insects:.02,hum:.48,crystal:.22,chime:.75,bird:.04}
 :{wind:.60,water:.06,waterLow:.02,insects:.12,hum:.04,crystal:.04,chime:.12,bird:.42};
 for(const [key,value] of Object.entries(profile)){const layer=ambienceLayers[key];if(layer)layer.gain.gain.setTargetAtTime(layer.base*value,t,1.25);}
 if(ambienceLayers.hum)ambienceLayers.hum.osc.frequency.setTargetAtTime(cave?72:(garden?112:waterfall?94:harbor?118:86),t,1.6);
 if(ambienceLayers.crystal)ambienceLayers.crystal.osc.frequency.setTargetAtTime(cave?294:(garden?523:392),t,1.6);
 if(ambienceLayers.chime)ambienceLayers.chime.osc.frequency.setTargetAtTime(cave?440:(garden?784:waterfall?587:harbor?698:660),t,1.6);
 if(ambienceLayers.bird)ambienceLayers.bird.osc.frequency.setTargetAtTime(meadowFrequency(),t,1.6);
 function meadowFrequency(){return waterfall?900:garden?1040:cave?520:harbor?820:1180;}
}

const makeupPalette=[['玫瑰粉','#ff9eb5',2],['蜜桃橘','#ffad8f',2],['櫻花粉','#ffb8d8',2],['莓果紅','#d94b78',3],['珊瑚橘','#ff765e',2],['薰衣草紫','#c69bff',2],['夢幻藍','#79caff',3],['薄荷綠','#7ce0c1',2],['香檳金','#f2cf83',3],['星塵銀','#cbd8ee',3],['奶茶棕','#bd8b75',2],['葡萄紫','#9d65c9',3],['夕陽橙','#ff914d',2],['冰晶青','#73e5e8',3],['莓奶茶','#c77c91',2],['月光白','#f2e8ff',3]];
const makeupWrap=document.querySelector('#makeupColors'),makeupMessage=document.querySelector('#makeupMessage');
makeupPalette.forEach(([name,hex,cost])=>{const b=document.createElement('button');b.style.cssText=`padding:7px 3px;border-radius:10px;border:2px solid #ffffff88;background:${hex};color:#241a2a;font-size:10px;font-weight:900;min-height:47px;text-shadow:0 1px 1px #fff8`;b.textContent=name+'\n'+cost+'元';b.addEventListener('click',()=>{if(!ownedMakeup.includes(hex)){if(coins<cost){makeupMessage.textContent='金幣不足，這支彩妝筆需要 '+cost+' 元';return;}coins-=cost;ownedMakeup.push(hex);try{localStorage.setItem('dreamIslandsMakeup',JSON.stringify(ownedMakeup));}catch(e){}}applyMakeup(hex);updateWallet();makeupMessage.textContent='已使用 '+name+' 彩妝筆！';});makeupWrap.appendChild(b);});
const shopPanel=document.querySelector('#shopPanel'),npcBuy=document.querySelector('#npcBuy');npcBuy.addEventListener('click',()=>{shopPanel.style.display='block';});document.querySelector('#shopClose').addEventListener('click',()=>{shopPanel.style.display='none';});
const outfitPrices={rose:5,ocean:8,gold:12};
shopPanel.querySelectorAll('[data-outfit]').forEach(btn=>{const id=btn.dataset.outfit;const names={rose:'櫻花披風',ocean:'星海旅人',gold:'金色星辰'};function refresh(){btn.textContent=ownedOutfits.includes(id)?(equippedOutfit===id?'✓ 已穿上：':'👕 穿上：')+names[id]:'🛍️ '+names[id]+'（'+outfitPrices[id]+' 鑽石）';}refresh();btn.addEventListener('click',()=>{if(!ownedOutfits.includes(id)){if(crystals<outfitPrices[id]){btn.textContent='鑽石不足，還差 '+(outfitPrices[id]-crystals)+' 顆';setTimeout(refresh,1300);return;}crystals-=outfitPrices[id];ownedOutfits.push(id);try{localStorage.setItem('dreamIslandsOutfits',JSON.stringify(ownedOutfits));}catch(e){}}equipOutfit(id);updateWallet();shopPanel.querySelectorAll('[data-outfit]').forEach(b=>{const k=b.dataset.outfit;b.textContent=ownedOutfits.includes(k)?(equippedOutfit===k?'✓ 已穿上：':'👕 穿上：')+names[k]:'🛍️ '+names[k]+'（'+outfitPrices[k]+' 鑽石）';});});});
document.querySelector('#foodBtn').addEventListener('click',()=>{if(coins<3){document.querySelector('#foodBtn').textContent='金幣不足，還需要 3 元';setTimeout(()=>document.querySelector('#foodBtn').textContent='🍰 買月光蛋糕（3 金幣，恢復 45 體力）',1300);return;}if(stamina>=staminaMax){document.querySelector('#foodBtn').textContent='體力已經滿了！';setTimeout(()=>document.querySelector('#foodBtn').textContent='🍰 買月光蛋糕（3 金幣，恢復 45 體力）',1100);return;}coins-=3;stamina=Math.min(staminaMax,stamina+45);updateStamina();updateWallet();});
updateStamina();

// A path of tiny lantern flowers
for(let i=0;i<42;i++){const t=i/41,x=-15+t*240,z=25+Math.sin(t*6)*80,y=heightAt(x,z);const lightOrb=addMesh(new THREE.SphereGeometry(.38,8,8),new THREE.MeshStandardMaterial({color:0xffe6aa,emissive:0xffbd68,emissiveIntensity:1.7}),x,y+1.5,z);if(i%4===0){const l=new THREE.PointLight(0xffd38b,.55,14);l.position.copy(lightOrb.position);scene.add(l);}}

// Controls
let moveX=0,moveZ=0,vy=0,onGround=true,walk=0,yaw=0,pitch=.2;
const joystick=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyId=null;
joystick.addEventListener('pointerdown',e=>{joyId=e.pointerId;joystick.setPointerCapture(joyId);updateJoy(e);});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)updateJoy(e);});
function updateJoy(e){const r=joystick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),k=Math.min(1,d/43);moveX=dx/(d||1)*k;moveZ=dy/(d||1)*k;stick.style.transform=`translate(${moveX*34}px,${moveZ*34}px)`;}
function endJoy(e){if(e.pointerId===joyId){joyId=null;moveX=moveZ=0;stick.style.transform='translate(0,0)';}}
joystick.addEventListener('pointerup',endJoy);joystick.addEventListener('pointercancel',endJoy);
document.querySelector('#jump').addEventListener('pointerdown',()=>{if(onGround&&stamina>=12){vy=12;onGround=false;stamina-=12;updateStamina();}});
document.querySelector('#home').addEventListener('click',()=>{player.position.set(0,heightAt(0,0),0);yaw=0;});
let cityUnlocked=false;try{cityUnlocked=localStorage.getItem('dreamIslandsCityUnlocked')==='1';}catch(e){}
const cityBtn=document.querySelector('#cityBtn');
function refreshCityButton(){cityBtn.textContent=cityUnlocked?'🏙️ 霓虹城已解鎖':'🏙️ 解鎖霓虹城（20元）';cityBtn.disabled=cityUnlocked;}
refreshCityButton();
cityBtn.addEventListener('click',()=>{if(cityUnlocked)return;if(coins<20){cityBtn.textContent='還差 '+(20-coins)+' 元才能解鎖';setTimeout(refreshCityButton,1700);return;}coins-=20;cityUnlocked=true;try{localStorage.setItem('dreamIslandsCityUnlocked','1');localStorage.setItem('dreamIslandsCoins',String(coins));}catch(e){}updateWallet();refreshCityButton();});
const destinations=[{x:0,z:0,name:'夢境草原・月光之境'},{x:-245,z:-235,name:'月霧花園'},{x:275,z:225,name:'水晶洞窟'},{x:-255,z:235,name:'古代星門遺跡'},{x:275,z:-235,name:'雲海港灣'},{x:cliffX,z:cliffZ,name:'月亮瀑布・星光之門'},{x:-315,z:8,name:'琉璃燈籠小鎮'},{x:8,z:315,name:'櫻花月泉島'},{x:350,z:260,name:'星帆海岸村'},{x:-320,z:-315,name:'蘑菇祕境森林'},{x:80,z:-320,name:'風車雲丘'}];let destinationIndex=0;
document.querySelector('#travel').addEventListener('click',()=>{const available=cityUnlocked?[...destinations,{x:cityX,z:cityZ,name:'紙醉金迷之城'}]:destinations;destinationIndex=(destinationIndex+1)%available.length;const d=available[destinationIndex];player.position.set(d.x,groundAt(d.x,d.z),d.z);vy=0;yaw=0;zone.textContent=d.name;});
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>145&&e.clientY<innerHeight-145){dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);}});
renderer.domElement.addEventListener('pointermove',e=>{if(dragging){yaw-=(e.clientX-lastX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.003,-.15,.8);lastX=e.clientX;lastY=e.clientY;}});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')moveZ=-1;if(e.key==='s'||e.key==='ArrowDown')moveZ=1;if(e.key==='a'||e.key==='ArrowLeft')moveX=-1;if(e.key==='d'||e.key==='ArrowRight')moveX=1;if(e.code==='Space'&&onGround){vy=12;onGround=false;}});
addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))moveZ=0;if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))moveX=0;});
const zone=document.querySelector('#zone'),clock=new THREE.Clock(),worldClock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 let activeX=player.position.x,activeZ=player.position.z,activeY=player.position.y;
 if(!driving){
  const dir=forward.clone().multiplyScalar(-moveZ).add(right.multiplyScalar(moveX));
  if(dir.lengthSq()>.001&&stamina>0){dir.normalize();stamina=Math.max(0,stamina-dt*2.2);updateStamina();const nx=player.position.x+dir.x*dt*15,nz=player.position.z+dir.z*dt*15;let blocked=false;for(const b of blockers){const dx=nx-b.x,dz=nz-b.z,dist=Math.hypot(dx,dz),min=b.r+1.8;if(dist<min){if(b.kind==='tree'){breakTree(b,dx,dz);continue;}blocked=true;const push=(min-dist)/(dist||1);player.position.x+=dx*push;player.position.z+=dz*push;}}if(!blocked){player.position.x=nx;player.position.z=nz;}player.rotation.y=Math.atan2(dir.x,dir.z);walk+=dt*10;legL.rotation.x=Math.sin(walk)*.5;legR.rotation.x=-Math.sin(walk)*.5;}
  if(moveX===0&&moveZ===0) {stamina=Math.min(staminaMax,stamina+dt*0.55);updateStamina();} const ground=groundAt(player.position.x,player.position.z);vy-=27*dt;player.position.y+=vy*dt;
  if(player.position.y<ground){player.position.y=ground;vy=0;onGround=true;}
  player.position.x=THREE.MathUtils.clamp(player.position.x,-365,625);player.position.z=THREE.MathUtils.clamp(player.position.z,-365,365);
  activeX=player.position.x;activeZ=player.position.z;activeY=player.position.y;
 }else{
  carSpeed+=(throttle*24-brake*38)*dt;carSpeed*=Math.pow(.985,dt*60);carSpeed=THREE.MathUtils.clamp(carSpeed,-10,30);
  car.rotation.y-=moveX*dt*(.75+Math.min(Math.abs(carSpeed)/18,.8))*(carSpeed<0?-1:1);
  const nx=car.position.x-Math.sin(car.rotation.y)*carSpeed*dt,nz=car.position.z-Math.cos(car.rotation.y)*carSpeed*dt;
  let blocked=false;for(const b of blockers){const dx=nx-b.x,dz=nz-b.z,dist=Math.hypot(dx,dz),min=b.r+3.2;if(dist<min){if(b.kind==='tree'){breakTree(b,dx,dz);carSpeed*=.72;continue;}blocked=true;carSpeed=0;}}
  if(!blocked){car.position.x=THREE.MathUtils.clamp(nx,-365,625);car.position.z=THREE.MathUtils.clamp(nz,-365,365);}
  car.position.y=groundAt(car.position.x,car.position.z);wheels.forEach(w=>w.rotation.x-=carSpeed*dt*1.5);
  activeX=car.position.x;activeZ=car.position.z;activeY=car.position.y;
 }
 const x=activeX,z=activeZ;
 const followYaw=driving?car.rotation.y:yaw;
 const target=new THREE.Vector3(activeX+Math.sin(followYaw)*22,activeY+(driving?12:10)+pitch*10,activeZ+Math.cos(followYaw)*22);
 camera.position.lerp(target,.09);camera.lookAt(activeX,activeY+(driving?1.8:2.4),activeZ);
 if(Math.hypot(x-cliffX,z-cliffZ)<75)zone.textContent='月亮瀑布・星光之門';
 else if(Math.hypot(x+245,z+235)<85)zone.textContent='月霧花園';
 else if(Math.hypot(x-275,z-225)<85)zone.textContent='水晶洞窟';
 else if(Math.hypot(x+255,z-235)<85)zone.textContent='古代星門遺跡';
 else if(Math.hypot(x-275,z+235)<85)zone.textContent='雲海港灣';
 else if(Math.hypot(x-cityX,z-cityZ)<112)zone.textContent='林口風格・星光 Outlet 購物城';
 else zone.textContent='夢境草原・月光之境';
 // Fallen trees regrow after a short rest, restoring their collision too.
 for(let i=treeRespawns.length-1;i>=0;i--){const t=treeRespawns[i];t.timer-=dt;if(t.timer<=0){t.tree.rotation.set(0,0,0);t.tree.visible=true;blockers.push({x:t.x,z:t.z,r:t.r,kind:'tree',object:t.tree,broken:false});treeRespawns.splice(i,1);}}
 // Crystal nodes slowly regenerate after mining.
 mineNodes.forEach(n=>{if(!n.available){n.respawn-=dt;if(n.respawn<=0){n.available=true;n.group.visible=true;}}else{n.group.children.forEach((c,i)=>{if(c.isMesh)c.rotation.y+=dt*(.35+i*.08);});}});
 updateWallet();
 // Animate fallen trees and their little leaf/wood fragments.
 fallingTrees.forEach(f=>{f.age+=dt;const k=1-Math.pow(1-Math.min(f.age/1.05,1),3);f.tree.rotation.x=THREE.MathUtils.lerp(f.fromX,f.toX,k);f.tree.rotation.z=THREE.MathUtils.lerp(f.fromZ,f.toZ,k);});
 for(let i=treeDebris.length-1;i>=0;i--){const d=treeDebris[i];d.life-=dt;d.vy-=15*dt;d.mesh.position.x+=d.vx*dt;d.mesh.position.y+=d.vy*dt;d.mesh.position.z+=d.vz*dt;d.mesh.rotation.x+=dt*4;d.mesh.rotation.z+=dt*3;if(d.life<=0){scene.remove(d.mesh);d.mesh.geometry.dispose();treeDebris.splice(i,1);}}
 // Local atmosphere animation: slow fog drift, gentle butterfly wingbeats and cave motes.
 gardenFog.children.forEach((o,i)=>{if(o.userData.baseY!==undefined){o.position.x+=Math.sin(worldClock.elapsedTime*.18+i)*dt*.7;o.position.y=o.userData.baseY+Math.sin(worldClock.elapsedTime*.45+i)*.45;}});
 butterflies.forEach((b,i)=>{const u=b.userData;b.position.x=u.origin.x+Math.sin(worldClock.elapsedTime*.42+u.phase)*5;b.position.y=u.origin.y+Math.sin(worldClock.elapsedTime*.9+u.phase)*1.8;b.position.z=u.origin.z+Math.cos(worldClock.elapsedTime*.35+u.phase)*4;u.left.rotation.z=Math.sin(worldClock.elapsedTime*11+u.phase)*.65;u.right.rotation.z=-Math.sin(worldClock.elapsedTime*11+u.phase)*.65;});
 caveDust.forEach((m,i)=>{m.position.y=caveY+4+((worldClock.elapsedTime*1.2+i*2.3)%20);m.position.x+=Math.sin(worldClock.elapsedTime*.4+i)*dt*.22;});
 const inGarden=Math.hypot(x+245,z+235)<92,inCave=Math.hypot(x-275,z-225)<72,inHarbor=Math.hypot(x-275,z+235)<110;
 setAmbienceScene(x,z);
 gardenGlow.intensity=inGarden?1.65:.25;caveShade.intensity=inCave?.95:.18;
 scene.fog.density=inCave?.0022:(inGarden?.00155:(inHarbor?.00095:.00072));
 harborRipples.forEach((r,i)=>{r.scale.x=1.2+Math.sin(worldClock.elapsedTime*.8+r.userData.phase)*.18;r.material.opacity=.15+Math.max(0,Math.sin(worldClock.elapsedTime*1.2+r.userData.phase))*.16;});
 cloudSea.children.forEach((g,i)=>{g.position.x+=Math.sin(worldClock.elapsedTime*.08+g.userData.phase)*dt*.7;g.position.z+=Math.cos(worldClock.elapsedTime*.07+g.userData.phase)*dt*.45;});
 harborFireflies.forEach((f)=>{f.position.y=f.userData.baseY+Math.sin(worldClock.elapsedTime*1.4+f.userData.phase)*1.2;f.material.opacity=.25+.65*(.5+.5*Math.sin(worldClock.elapsedTime*2+f.userData.phase));});
 stars.rotation.y+=dt*.0008;falls.forEach((f,i)=>{const a=f.geometry.attributes.position;for(let k=0;k<a.count;k++){const x=a.getX(k),y=a.getY(k),z=a.getZ(k);a.setX(k,x+Math.sin(worldClock.elapsedTime*2.2+y*.22+i)*.018);a.setZ(k,z+Math.sin(worldClock.elapsedTime*2.8+y*.3+i)*.025);}a.needsUpdate=true;});const nearClerk=!driving&&Math.hypot(player.position.x-(cityX-8),player.position.z-(cityZ+18))<11; npcBuy.style.display=nearClerk?'block':'none';renderer.render(scene,camera);
}
animate();document.querySelector('#loading').style.display='none';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
