<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>夢境群島 Dream Islands｜月瀑星夜</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10132f;font-family:system-ui,"Noto Sans TC",sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#title{position:fixed;top:14px;left:14px;color:#fff;text-shadow:0 2px 12px #19204c;font-weight:850;font-size:18px;letter-spacing:1px;pointer-events:none}
#hint{position:fixed;top:43px;left:15px;color:#e7e5ff;text-shadow:0 2px 8px #19204c;font-size:12px;pointer-events:none}
#joystick{position:fixed;left:22px;bottom:25px;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff65;touch-action:none}
#stick{position:absolute;left:33px;top:33px;width:46px;height:46px;border-radius:50%;background:#fff9;border:2px solid white;box-shadow:0 3px 12px #477b8066}
#jump{position:fixed;right:25px;bottom:36px;width:68px;height:68px;border-radius:50%;border:2px solid #fff;background:#ffffff35;color:#fff;font-weight:800;font-size:15px}
#vehicle{position:fixed;right:20px;top:108px;border:1px solid #fff;border-radius:22px;padding:10px 14px;background:#68a9bd99;color:#fff;font-weight:800}
#gas{position:fixed;right:25px;bottom:120px;width:70px;height:70px;border-radius:50%;border:2px solid #fff;background:#4cbd9c99;color:#fff;font-weight:800;display:none;touch-action:none}
#brake{position:fixed;right:108px;bottom:36px;width:62px;height:62px;border-radius:50%;border:2px solid #fff;background:#d58c9c99;color:#fff;font-weight:800;display:none;touch-action:none}
#home{position:fixed;right:22px;top:16px;border:1px solid #fff9;border-radius:20px;padding:9px 13px;background:#ffffff30;color:#fff;font-weight:700}
#zone{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#17183d88;color:white;text-shadow:0 1px 5px #345;font-size:12px;white-space:nowrap;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#17183d,#6575a7);color:#fff;font-size:20px;font-weight:800;z-index:5;text-shadow:0 2px 8px #456}
#travel{position:fixed;right:22px;top:58px;border:1px solid #fff9;border-radius:20px;padding:9px 13px;background:#9b8cff66;color:#fff;font-weight:700}
#musicBtn{position:fixed;left:14px;top:76px;border:1px solid #ffffff99;border-radius:20px;padding:8px 12px;background:#27365fbb;color:#fff;font-weight:700;font-size:12px}
#musicFile{display:none}
#ambienceBtn{position:fixed;left:14px;top:118px;border:1px solid #ffffff99;border-radius:20px;padding:8px 12px;background:#345a70bb;color:#fff;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div id="game"></div><div id="loading">月亮正在升起，星星正在點亮……</div>
<div id="title">夢境群島</div><div id="hint">Dream Islands · 月瀑星夜</div>
<button id="home">回到起點</button><button id="travel">前往新場景 ✦</button><button id="vehicle">🚗 上車</button>
<div id="joystick"><div id="stick"></div></div><button id="jump">跳躍</button><button id="gas">前進</button><button id="brake">煞車</button>
<div id="zone">夢境草原・月光之境</div><button id="musicBtn">🎵 選擇音樂</button><button id="ambienceBtn">🌬️ 環境音：關</button><input id="musicFile" type="file" accept="audio/*">
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.querySelector('#game'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x171b43);
scene.fog=new THREE.FogExp2(0x30365f,.00072);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xabbcff,0x43536a,1.7));
const moonLight=new THREE.DirectionalLight(0xc7d7ff,2.0);moonLight.position.set(-170,240,-120);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(1024,1024);moonLight.shadow.camera.left=-240;moonLight.shadow.camera.right=240;moonLight.shadow.camera.top=240;moonLight.shadow.camera.bottom=-240;scene.add(moonLight);
const fill=new THREE.PointLight(0x9bbaff,1.2,260);fill.position.set(-120,75,-100);scene.add(fill);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grassMat=mat(0x6e9e78),rockMats=[mat(0x68758d),mat(0x7d879b),mat(0x53647a)],woodMat=mat(0x604a51);
const leafMats=[mat(0x376d67),mat(0x477e72),mat(0x5b8b78),mat(0x718f7d)];
const flowerMats=[mat(0xffe8ae),mat(0xf3b6d1),mat(0xbfc6ff),mat(0xffffff)];
const rand=(a,b)=>a+Math.random()*(b-a);
const blockers=[];
function block(x,z,r){blockers.push({x,z,r});}
function heightAt(x,z){return 4+Math.sin(x*.021+Math.cos(z*.017))*1.8+Math.sin(z*.037-x*.013)*1.1+Math.cos((x+z)*.012)*2.3+Math.sin(x*.008)*2+Math.max(0,1-Math.abs(x-170)/150)*Math.max(0,1-Math.abs(z+115)/190)*28;}
function addMesh(geo,material,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}

// Rich midnight sky: stars, Milky Way dust, moon and halo
const starPositions=[],starColors=[];
for(let i=0;i<2600;i++){
 const u=Math.random()*Math.PI*2,v=Math.acos(rand(-1,1)),r=1250;
 const x=r*Math.sin(v)*Math.cos(u),y=Math.abs(r*Math.cos(v)),z=r*Math.sin(v)*Math.sin(u);
 starPositions.push(x,y,z);
 const c=new THREE.Color().setHSL(rand(.53,.72),rand(.25,.7),rand(.65,1));starColors.push(c.r,c.g,c.b);
}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));starGeo.setAttribute('color',new THREE.Float32BufferAttribute(starColors,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:2.3,vertexColors:true,transparent:true,opacity:.95,sizeAttenuation:false}));scene.add(stars);
// Extra distant star clusters add depth to the night sky.
for(let layer=0;layer<3;layer++){const pts=[];for(let i=0;i<420;i++){const a=rand(0,Math.PI*2),r=rand(380,1050);pts.push(Math.cos(a)*r,rand(100,650),Math.sin(a)*r);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:layer===1?0xb8caff:0xe5dcff,size:layer===1?1.6:1.1,transparent:true,opacity:.48,sizeAttenuation:false})));}
// Milky-way ribbon of tiny stars
const dustPos=[];
for(let i=0;i<1900;i++){const t=rand(-1,1),a=rand(-1,1);dustPos.push(t*650,210+a*48+Math.sin(t*5)*32,-430+t*170);}
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3));
scene.add(new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xc7cfff,size:2.2,transparent:true,opacity:.7,sizeAttenuation:false})));
const moon=new THREE.Mesh(new THREE.SphereGeometry(31,48,40),new THREE.MeshStandardMaterial({color:0xfff0d2,emissive:0xffdca0,emissiveIntensity:.55,roughness:1}));
moon.position.set(-185,205,-470);scene.add(moon);
const halo=new THREE.Mesh(new THREE.SphereGeometry(43,32,24),new THREE.MeshBasicMaterial({color:0xb9caff,transparent:true,opacity:.11,side:THREE.BackSide}));halo.position.copy(moon.position);scene.add(halo);
const moonGlow=new THREE.PointLight(0xbacaff,2.4,520);moonGlow.position.copy(moon.position);scene.add(moonGlow);
// Soft luminous cloud banks
const cloudMat=new THREE.MeshStandardMaterial({color:0x8d9ac9,transparent:true,opacity:.33,roughness:1});
for(let i=0;i<36;i++){const g=new THREE.Group(),x=rand(-550,550),z=rand(-550,550),y=rand(90,170);for(let j=0;j<6;j++){const p=new THREE.Mesh(new THREE.SphereGeometry(rand(8,18),10,8),cloudMat);p.position.set(rand(-17,17),rand(-4,4),rand(-10,10));p.scale.y=.55;g.add(p);}g.position.set(x,y,z);scene.add(g);}

// Rolling natural terrain with vertex color variation
const size=760,seg=230,geo=new THREE.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position,colors=[];
const cA=new THREE.Color(0x789f7c),cB=new THREE.Color(0x547e75),cC=new THREE.Color(0x9aa18b),cD=new THREE.Color(0x687d91);
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),h=heightAt(x,z);pos.setY(i,h);let c=cA.clone();const n=Math.sin(x*.035)*Math.cos(z*.03);if(n>.35)c.lerp(cB,.3);if(h>23)c.lerp(cC,.4);if(n<-.7)c.lerp(cD,.16);colors.push(c.r,c.g,c.b);}
geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.computeVertexNormals();
const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));terrain.receiveShadow=true;scene.add(terrain);

// Distant layered mountain silhouettes
for(let i=0;i<50;i++){const a=i/50*Math.PI*2,r=510+rand(-25,55),x=Math.cos(a)*r,z=Math.sin(a)*r,h=rand(70,155);const m=addMesh(new THREE.ConeGeometry(rand(24,46),h,9),mat(i%2?0x596b87:0x71809d),x,h/2-5,z);m.rotation.y=rand(0,6);}

// Trees with correctly separated trunks, layered rounded crowns and branch-like detail
for(let i=0;i<420;i++){
 const x=rand(-340,340),z=rand(-340,340);if(Math.hypot(x,z)<32||Math.hypot(x-170,z+115)<58)continue;
 const y=heightAt(x,z),s=rand(.72,1.3);
 block(x,z,2.8*s);
 addMesh(new THREE.CylinderGeometry(.32*s,.65*s,6*s,7),woodMat,x,y+3*s,z);
 const crownMat=leafMats[i%leafMats.length];
 const crown=addMesh(new THREE.SphereGeometry(4.2*s,10,9),crownMat,x,y+8*s,z,1,1.15,1);
 const crown2=addMesh(new THREE.SphereGeometry(3.2*s,9,8),leafMats[(i+1)%leafMats.length],x+rand(-1.6,1.6)*s,y+10.2*s,z+rand(-1.5,1.5)*s,.95,.9,.95);
 // small branch arms
 for(let b=0;b<2;b++){const branch=addMesh(new THREE.CylinderGeometry(.12*s,.2*s,2.6*s,5),woodMat,x+(b?1:-1)*1.15*s,y+5.4*s,z);branch.rotation.z=(b?-.7:.7);}
}

// Dense meadow patches with little flowers and grass blades
for(let patch=0;patch<155;patch++){
 const cx=rand(-330,330),cz=rand(-330,330);if(Math.hypot(cx,cz)<25)continue;
 for(let j=0;j<15;j++){
  const x=cx+rand(-7,7),z=cz+rand(-7,7),y=heightAt(x,z);
  const blade=addMesh(new THREE.ConeGeometry(.13,rand(.65,1.35),4),mat(j%3?0x5c936e:0x86a97a),x,y+.45,z);
  blade.rotation.z=rand(-.35,.35);
  if(j%4===0){const bloom=addMesh(new THREE.SphereGeometry(.22,7,6),flowerMats[(patch+j)%4],x,y+.95,z);bloom.castShadow=false;}
 }
}

// Rock formations: small clustered stones, not isolated giant boulders
for(let i=0;i<95;i++){
 const x=rand(-340,340),z=rand(-340,340);if(Math.hypot(x,z)<40)continue;const y=heightAt(x,z);
 const count=3+Math.floor(Math.random()*4);
 block(x,z,4.5);
 for(let j=0;j<count;j++){const s=rand(.45,1.35),m=addMesh(new THREE.DodecahedronGeometry(s,1),rockMats[(i+j)%3],x+rand(-2.8,2.8),y+s*.45,z+rand(-2.8,2.8),rand(.8,1.5),rand(.55,1.1),rand(.8,1.4));m.rotation.set(rand(0,1),rand(0,6),rand(0,1));}
}

// Moonfall waterfall v2: a curved, segmented water sheet that hugs the cliff face.
const cliffX=175,cliffZ=-115,cliffY=heightAt(cliffX,cliffZ);
for(let i=0;i<11;i++){
 const a=i/11*Math.PI*2,rx=rand(12,22),rz=rand(9,17),x=cliffX+Math.cos(a)*rx,z=cliffZ+Math.sin(a)*rz;
 const rock=addMesh(new THREE.DodecahedronGeometry(rand(8,14),1),rockMats[i%3],x,cliffY+rand(8,25),z,1.1,rand(1.1,1.8),.9);rock.rotation.y=rand(0,6);
}
const waterMat=new THREE.MeshPhysicalMaterial({color:0x9ceaff,emissive:0x287da8,emissiveIntensity:.42,transparent:true,opacity:.79,roughness:.12,metalness:.05,clearcoat:1,clearcoatRoughness:.08,side:THREE.DoubleSide,depthWrite:false});
function makeCliffWater(offset=0,width=7){
 const rows=34,cols=8,vertices=[],indices=[];
 for(let j=0;j<=rows;j++){
  const t=j/rows;
  for(let i=0;i<=cols;i++){
   const u=i/cols-.5,flowX=cliffX+Math.sin(t*5.2+offset)*2.2+u*width;
   const flowY=cliffY+24-t*27+Math.sin(t*18+u*4+offset)*.28;
   const faceZ=cliffZ+8+t*30+Math.sin(t*4+offset)*1.1-Math.max(0,Math.abs(u)-.34)*2.5;
   vertices.push(flowX,flowY,faceZ);
  }
 }
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=j*(cols+1)+i,b=a+cols+1;indices.push(a,b,a+1,b,b+1,a+1);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setIndex(indices);g.computeVertexNormals();
 const mesh=new THREE.Mesh(g,waterMat);mesh.material=waterMat;mesh.userData.flowOffset=offset;scene.add(mesh);return mesh;
}
const falls=[makeCliffWater(0,8.5),makeCliffWater(2.1,4.2),makeCliffWater(4.3,3.1)];
// A shallow pool whose shoreline follows the same rolling terrain instead of a floating flat disc.
const poolGeo=new THREE.CircleGeometry(27,64,0,Math.PI*2);poolGeo.rotateX(-Math.PI/2);
const pp=poolGeo.attributes.position;
for(let i=0;i<pp.count;i++){
 const x=cliffX+pp.getX(i)*1.48,z=cliffZ+38+pp.getZ(i)*.88;
 pp.setXYZ(i,pp.getX(i)*1.48,heightAt(x,z)-.48-(1-Math.min(1,Math.hypot(pp.getX(i),pp.getZ(i))/27))*.15,pp.getZ(i)*.88);
}
poolGeo.computeVertexNormals();
const pool=new THREE.Mesh(poolGeo,new THREE.MeshPhysicalMaterial({color:0x48b9d2,emissive:0x123f65,emissiveIntensity:.3,transparent:true,opacity:.78,roughness:.12,metalness:.08,clearcoat:1,side:THREE.DoubleSide,depthWrite:false}));pool.position.set(cliffX,0,cliffZ+38);scene.add(pool);
// Foam at the impact edge and soft spray around the base.
for(let i=0;i<34;i++){
 const a=i/34*Math.PI*2,r=rand(14,30),x=cliffX+Math.cos(a)*r,z=cliffZ+38+Math.sin(a)*r*.65,y=heightAt(x,z)+.12;
 const foam=addMesh(new THREE.SphereGeometry(rand(.35,.9),8,6),new THREE.MeshBasicMaterial({color:0xc8f4ff,transparent:true,opacity:.38}),x,y,z,rand(1.2,2.4),.22,rand(.8,1.5));foam.castShadow=false;
}
for(let i=0;i<42;i++){const mist=new THREE.Mesh(new THREE.SphereGeometry(rand(1.2,3.2),8,7),new THREE.MeshBasicMaterial({color:0xc9eaff,transparent:true,opacity:.12}));mist.position.set(cliffX+rand(-27,27),cliffY+rand(-2,16),cliffZ+rand(24,55));mist.scale.y=.7;scene.add(mist);}
for(let i=0;i<13;i++){const crystal=addMesh(new THREE.OctahedronGeometry(rand(.8,1.8)),new THREE.MeshStandardMaterial({color:0x9cecff,emissive:0x3daddd,emissiveIntensity:1.2,roughness:.2}),cliffX+rand(-27,27),cliffY+rand(2,18),cliffZ+rand(-8,44));}

// Winding stream reflecting the moonlight
for(let i=0;i<34;i++){const z=-200+i*12,x=70+Math.sin(i*.2)*38;const s=addMesh(new THREE.CylinderGeometry(1.4,2,12,8),new THREE.MeshStandardMaterial({color:0x4d9fc1,transparent:true,opacity:.78,roughness:.2}),x,heightAt(x,z)+.25,z);s.rotation.z=Math.PI/2;s.rotation.y=.3;}

// Ancient moon gate
for(let side=0;side<2;side++){const col=addMesh(new THREE.CylinderGeometry(1.8,2.3,15,9),rockMats[0],cliffX+(side?8:-8),cliffY+8,cliffZ-25);}
const lintel=addMesh(new THREE.BoxGeometry(21,3,4),rockMats[1],cliffX,cliffY+16,cliffZ-25);
for(let i=0;i<12;i++){const orb=addMesh(new THREE.SphereGeometry(.38,8,8),new THREE.MeshStandardMaterial({color:0xffe6a5,emissive:0xffc66c,emissiveIntensity:1.6}),cliffX+rand(-23,23),cliffY+rand(4,16),cliffZ+rand(-36,42));}

// Four distinct exploration districts across the large island
const regionLabels=[
 {name:'月霧花園',x:-245,z:-235,color:0xe6b9ff},
 {name:'水晶洞窟',x:275,z:225,color:0x86eaff},
 {name:'古代星門遺跡',x:-255,z:235,color:0xffd78c},
 {name:'雲海港灣',x:275,z:-235,color:0xa9d9ff}
];
// Moon-mist garden: glowing flowers and pale trees
for(let i=0;i<95;i++){const a=rand(0,Math.PI*2),r=rand(12,65),x=-245+Math.cos(a)*r,z=-235+Math.sin(a)*r,y=heightAt(x,z);const stem=addMesh(new THREE.CylinderGeometry(.09,.13,1.1,5),mat(0x638b83),x,y+.55,z);const glow=addMesh(new THREE.SphereGeometry(rand(.35,.7),9,8),new THREE.MeshStandardMaterial({color:0xf1caff,emissive:0xa45bcf,emissiveIntensity:1.5}),x,y+1.2,z);if(i%9===0){const l=new THREE.PointLight(0xc88cff,.7,22);l.position.set(x,y+2,z);scene.add(l);}}
for(let i=0;i<13;i++){const x=-245+rand(-58,58),z=-235+rand(-58,58),y=heightAt(x,z);block(x,z,2.4);addMesh(new THREE.CylinderGeometry(.35,.7,7,7),mat(0x75628a),x,y+3.5,z);addMesh(new THREE.SphereGeometry(4.2,10,9),mat(0x9d82b5),x,y+8,z,1,1.25,1);}
// Crystal cave: layered rock arch and luminous crystal clusters
for(let i=0;i<18;i++){const a=i/18*Math.PI*2,x=275+Math.cos(a)*29,z=225+Math.sin(a)*23,y=heightAt(x,z);const h=rand(10,21);const rock=addMesh(new THREE.ConeGeometry(rand(5,9),h,7),mat(0x465b79),x,y+h/2-1,z);rock.rotation.z=rand(-.15,.15);block(x,z,4.5);}
for(let i=0;i<55;i++){const x=275+rand(-38,38),z=225+rand(-30,30),y=heightAt(x,z);const crystal=addMesh(new THREE.ConeGeometry(rand(.8,2.2),rand(4,10),6),new THREE.MeshStandardMaterial({color:i%2?0x83eaff:0xb5a5ff,emissive:i%2?0x237eae:0x6550aa,emissiveIntensity:1.2,roughness:.25}),x,y+2.5,z);crystal.rotation.z=rand(-.18,.18);}
// Ancient star-gate ruins with broken columns and a stone path
for(let i=0;i<9;i++){const a=i/9*Math.PI*2,x=-255+Math.cos(a)*27,z=235+Math.sin(a)*27,y=heightAt(x,z);const h=rand(7,13);const col=addMesh(new THREE.CylinderGeometry(1.6,2.1,h,8),mat(0x8d8290),x,y+h/2,z);col.rotation.z=rand(-.12,.12);block(x,z,3.2);}
const ruinTop=addMesh(new THREE.BoxGeometry(42,3,5),mat(0xa99a9b),-255,heightAt(-255,208)+13,208);ruinTop.rotation.z=.08;
for(let i=0;i<24;i++){const x=-255+rand(-34,34),z=235+rand(-34,34),y=heightAt(x,z);addMesh(new THREE.DodecahedronGeometry(rand(1.2,3),1),mat(0x7f7788),x,y+1,z,1.4,.7,1);}
// Cloud harbor: floating lanterns, pale arches and a reflecting pool
const harborY=heightAt(275,-235);
for(let i=0;i<3;i++){const x=245+i*30,z=-235;const arch=addMesh(new THREE.TorusGeometry(10,1.2,8,28,Math.PI),mat(0x9bb7d8),x,harborY+10,z);arch.rotation.z=Math.PI;block(x,z,3);}
const harborPool=addMesh(new THREE.CircleGeometry(17,40),new THREE.MeshStandardMaterial({color:0x6abbd7,emissive:0x174f77,emissiveIntensity:.45,transparent:true,opacity:.82,roughness:.2}),275,harborY+.2,-235);harborPool.rotation.x=-Math.PI/2;harborPool.scale.set(1.4,1,1);
for(let i=0;i<20;i++){const x=275+rand(-28,28),z=-235+rand(-25,25),y=harborY+rand(8,25);const orb=addMesh(new THREE.SphereGeometry(.55,10,8),new THREE.MeshStandardMaterial({color:0xffe5ae,emissive:0xffc56d,emissiveIntensity:1.8}),x,y,z);const light=new THREE.PointLight(0xffd28b,.35,12);light.position.copy(orb.position);scene.add(light);}

// Local atmosphere for Moon-mist Garden: layered low fog, moonlit motes and butterflies.
const gardenFog=new THREE.Group();scene.add(gardenFog);
const fogMat=new THREE.MeshBasicMaterial({color:0xc7c8ef,transparent:true,opacity:.075,depthWrite:false});
for(let i=0;i<46;i++){
 const puff=new THREE.Mesh(new THREE.SphereGeometry(rand(3.5,8),10,8),fogMat);
 puff.position.set(-245+rand(-78,78),heightAt(-245,-235)+rand(1.5,8),-235+rand(-76,76));
 puff.scale.set(rand(1.5,2.8),.32,rand(1.2,2.4));puff.userData.baseY=puff.position.y;gardenFog.add(puff);
}
const butterflies=[];
for(let i=0;i<13;i++){
 const b=new THREE.Group();b.position.set(-245+rand(-54,54),heightAt(-245,-235)+rand(2,10),-235+rand(-54,54));
 const wingMat=new THREE.MeshBasicMaterial({color:i%3===0?0xffd9f4:(i%3===1?0xd7e8ff:0xffefc1),transparent:true,opacity:.9,side:THREE.DoubleSide});
 const left=new THREE.Mesh(new THREE.SphereGeometry(.34,8,6),wingMat),right=left.clone();
 left.scale.set(.85,.16,.52);right.scale.set(.85,.16,.52);left.position.x=-.32;right.position.x=.32;
 b.add(left,right);b.userData={left,right,phase:rand(0,6.28),origin:b.position.clone()};butterflies.push(b);gardenFog.add(b);
}
const gardenGlow=new THREE.PointLight(0xc6a5ff,1.15,105);gardenGlow.position.set(-245,18,-235);scene.add(gardenGlow);

// Crystal cavern: a dark overhead rock vault, deep blue ambient shade and sparse crystal light.
const caveX=275,caveZ=225,caveY=heightAt(caveX,caveZ);
const caveShell=new THREE.Mesh(new THREE.SphereGeometry(48,28,18,0,Math.PI*2,0,Math.PI*.53),new THREE.MeshStandardMaterial({color:0x172238,roughness:1,side:THREE.BackSide}));
caveShell.position.set(caveX,caveY+3,caveZ);caveShell.scale.set(1.12,.92,.92);scene.add(caveShell);
const caveShade=new THREE.PointLight(0x25395f,.65,95);caveShade.position.set(caveX,caveY+13,caveZ);scene.add(caveShade);
const caveRays=[];
for(let i=0;i<7;i++){
 const x=caveX+rand(-27,27),z=caveZ+rand(-20,20),y=heightAt(x,z);
 const crystalLight=new THREE.PointLight(i%2?0x63cfff:0x9c8cff,1.0,25);crystalLight.position.set(x,y+5,z);scene.add(crystalLight);caveRays.push(crystalLight);
}
const caveDust=[];
for(let i=0;i<34;i++){
 const mote=addMesh(new THREE.SphereGeometry(.12,6,5),new THREE.MeshBasicMaterial({color:i%2?0x9ceaff:0xc8baff,transparent:true,opacity:.7}),caveX+rand(-33,33),caveY+rand(2,24),caveZ+rand(-28,28));mote.castShadow=false;caveDust.push(mote);
}

// Simple local audio controls: the player can choose an audio file from their own device.
const musicInput=document.querySelector('#musicFile'),musicButton=document.querySelector('#musicBtn');
const userAudio=new Audio();userAudio.loop=true;userAudio.volume=.42;
musicButton.addEventListener('click',()=>musicInput.click());
musicInput.addEventListener('change',()=>{const file=musicInput.files&&musicInput.files[0];if(!file)return;userAudio.src=URL.createObjectURL(file);userAudio.play().then(()=>{musicButton.textContent='🎵 '+file.name.slice(0,12);}).catch(()=>{musicButton.textContent='點一下播放音樂';});});
const ambienceButton=document.querySelector('#ambienceBtn');let ambienceContext=null,ambienceSource=null,ambienceGain=null,ambienceOn=false;
ambienceButton.addEventListener('click',async()=>{
 if(!ambienceContext){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){ambienceButton.textContent='此瀏覽器不支援音效';return;}ambienceContext=new AC();
 const buffer=ambienceContext.createBuffer(1,ambienceContext.sampleRate*3,ambienceContext.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.22;
 ambienceSource=ambienceContext.createBufferSource();ambienceSource.buffer=buffer;ambienceSource.loop=true;
 const filter=ambienceContext.createBiquadFilter();filter.type='lowpass';filter.frequency.value=520;
 ambienceGain=ambienceContext.createGain();ambienceGain.gain.value=0;
 ambienceSource.connect(filter);filter.connect(ambienceGain);ambienceGain.connect(ambienceContext.destination);ambienceSource.start();
 }
 await ambienceContext.resume();ambienceOn=!ambienceOn;ambienceGain.gain.setTargetAtTime(ambienceOn?.035:0,ambienceContext.currentTime,.35);
 ambienceButton.textContent=ambienceOn?'🌬️ 環境音：開':'🌬️ 環境音：關';
});

// Character
const player=new THREE.Group(),bodyMat=mat(0x293b55);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.85,2,4,8),bodyMat);body.position.y=2.45;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.78,14,12),mat(0xffdfc6));head.position.y=4.55;player.add(head);
const cape=new THREE.Mesh(new THREE.ConeGeometry(1.4,3.4,9),new THREE.MeshStandardMaterial({color:0xe8c8ff,side:THREE.DoubleSide}));cape.position.set(0,2.6,-.9);cape.rotation.x=-Math.PI/2.4;player.add(cape);
const legGeo=new THREE.CapsuleGeometry(.28,.85,3,6),legL=new THREE.Mesh(legGeo,bodyMat),legR=legL.clone();legL.position.set(-.4,.7,0);legR.position.set(.4,.7,0);player.add(legL,legR);
player.position.set(0,heightAt(0,0),0);scene.add(player);

// A small moonlit exploration buggy. It is intentionally simple and light for phones.
const car=new THREE.Group();
const carBody=new THREE.Mesh(new THREE.BoxGeometry(4.2,1.15,6.2),new THREE.MeshStandardMaterial({color:0x527d91,metalness:.35,roughness:.42}));
carBody.position.y=1.65;carBody.castShadow=true;car.add(carBody);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(3.1,1.45,2.8),new THREE.MeshStandardMaterial({color:0xa9d7e4,transparent:true,opacity:.68,roughness:.2}));
cabin.position.set(0,2.85,-.35);cabin.castShadow=true;car.add(cabin);
const roof=new THREE.Mesh(new THREE.BoxGeometry(3.3,.22,3),new THREE.MeshStandardMaterial({color:0xe2d4b5,metalness:.25,roughness:.4}));
roof.position.set(0,3.62,-.35);car.add(roof);
const wheelMat=new THREE.MeshStandardMaterial({color:0x202a3c,roughness:.9});
const wheels=[];
for(const x of [-2.05,2.05]) for(const z of [-2,2]){
 const w=new THREE.Mesh(new THREE.CylinderGeometry(.82,.82,.48,16),wheelMat);
 w.rotation.z=Math.PI/2;w.position.set(x,.92,z);w.castShadow=true;car.add(w);wheels.push(w);
}
const lampMat=new THREE.MeshStandardMaterial({color:0xffefbd,emissive:0xffd27a,emissiveIntensity:1.8});
for(const x of [-1.35,1.35]){const lamp=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),lampMat);lamp.position.set(x,1.9,-3.12);car.add(lamp);}
car.visible=false;scene.add(car);
let driving=false,carSpeed=0,throttle=0,brake=0;
const vehicleBtn=document.querySelector('#vehicle'),gasBtn=document.querySelector('#gas'),brakeBtn=document.querySelector('#brake');
vehicleBtn.addEventListener('click',()=>{
 driving=!driving;carSpeed=0;car.visible=driving;player.visible=!driving;
 if(driving){car.position.set(player.position.x,heightAt(player.position.x,player.position.z),player.position.z);car.rotation.y=player.rotation.y;vehicleBtn.textContent='🚶 下車';}
 else {player.position.set(car.position.x+Math.sin(car.rotation.y)*4,heightAt(car.position.x,car.position.z),car.position.z+Math.cos(car.rotation.y)*4);vehicleBtn.textContent='🚗 上車';}
 gasBtn.style.display=driving?'block':'none';brakeBtn.style.display=driving?'block':'none';document.querySelector('#jump').style.display=driving?'none':'block';
});
function holdButton(el,setter){el.addEventListener('pointerdown',e=>{e.preventDefault();setter(1);el.setPointerCapture(e.pointerId);});const stop=()=>setter(0);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop);}
holdButton(gasBtn,v=>throttle=v);holdButton(brakeBtn,v=>brake=v);


// A path of tiny lantern flowers
for(let i=0;i<42;i++){const t=i/41,x=-15+t*240,z=25+Math.sin(t*6)*80,y=heightAt(x,z);const lightOrb=addMesh(new THREE.SphereGeometry(.38,8,8),new THREE.MeshStandardMaterial({color:0xffe6aa,emissive:0xffbd68,emissiveIntensity:1.7}),x,y+1.5,z);if(i%4===0){const l=new THREE.PointLight(0xffd38b,.55,14);l.position.copy(lightOrb.position);scene.add(l);}}

// Controls
let moveX=0,moveZ=0,vy=0,onGround=true,walk=0,yaw=0,pitch=.2;
const joystick=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyId=null;
joystick.addEventListener('pointerdown',e=>{joyId=e.pointerId;joystick.setPointerCapture(joyId);updateJoy(e);});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)updateJoy(e);});
function updateJoy(e){const r=joystick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),k=Math.min(1,d/43);moveX=dx/(d||1)*k;moveZ=dy/(d||1)*k;stick.style.transform=`translate(${moveX*34}px,${moveZ*34}px)`;}
function endJoy(e){if(e.pointerId===joyId){joyId=null;moveX=moveZ=0;stick.style.transform='translate(0,0)';}}
joystick.addEventListener('pointerup',endJoy);joystick.addEventListener('pointercancel',endJoy);
document.querySelector('#jump').addEventListener('pointerdown',()=>{if(onGround){vy=12;onGround=false;}});
document.querySelector('#home').addEventListener('click',()=>{player.position.set(0,heightAt(0,0),0);yaw=0;});
const destinations=[{x:0,z:0,name:'夢境草原・月光之境'},{x:-245,z:-235,name:'月霧花園'},{x:275,z:225,name:'水晶洞窟'},{x:-255,z:235,name:'古代星門遺跡'},{x:275,z:-235,name:'雲海港灣'},{x:cliffX,z:cliffZ,name:'月亮瀑布・星光之門'}];let destinationIndex=0;
document.querySelector('#travel').addEventListener('click',()=>{destinationIndex=(destinationIndex+1)%destinations.length;const d=destinations[destinationIndex];player.position.set(d.x,heightAt(d.x,d.z),d.z);vy=0;yaw=0;zone.textContent=d.name;});
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>145&&e.clientY<innerHeight-145){dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);}});
renderer.domElement.addEventListener('pointermove',e=>{if(dragging){yaw-=(e.clientX-lastX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.003,-.15,.8);lastX=e.clientX;lastY=e.clientY;}});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')moveZ=-1;if(e.key==='s'||e.key==='ArrowDown')moveZ=1;if(e.key==='a'||e.key==='ArrowLeft')moveX=-1;if(e.key==='d'||e.key==='ArrowRight')moveX=1;if(e.code==='Space'&&onGround){vy=12;onGround=false;}});
addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))moveZ=0;if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))moveX=0;});
const zone=document.querySelector('#zone'),clock=new THREE.Clock(),worldClock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 let activeX=player.position.x,activeZ=player.position.z,activeY=player.position.y;
 if(!driving){
  const dir=forward.clone().multiplyScalar(-moveZ).add(right.multiplyScalar(moveX));
  if(dir.lengthSq()>.001){dir.normalize();const nx=player.position.x+dir.x*dt*15,nz=player.position.z+dir.z*dt*15;let blocked=false;for(const b of blockers){const dx=nx-b.x,dz=nz-b.z,dist=Math.hypot(dx,dz),min=b.r+1.8;if(dist<min){blocked=true;const push=(min-dist)/(dist||1);player.position.x+=dx*push;player.position.z+=dz*push;}}if(!blocked){player.position.x=nx;player.position.z=nz;}player.rotation.y=Math.atan2(dir.x,dir.z);walk+=dt*10;legL.rotation.x=Math.sin(walk)*.5;legR.rotation.x=-Math.sin(walk)*.5;}
  const ground=heightAt(player.position.x,player.position.z);vy-=27*dt;player.position.y+=vy*dt;
  if(player.position.y<ground){player.position.y=ground;vy=0;onGround=true;}
  player.position.x=THREE.MathUtils.clamp(player.position.x,-365,365);player.position.z=THREE.MathUtils.clamp(player.position.z,-365,365);
  activeX=player.position.x;activeZ=player.position.z;activeY=player.position.y;
 }else{
  carSpeed+=(throttle*24-brake*38)*dt;carSpeed*=Math.pow(.985,dt*60);carSpeed=THREE.MathUtils.clamp(carSpeed,-10,30);
  car.rotation.y-=moveX*dt*(.75+Math.min(Math.abs(carSpeed)/18,.8))*(carSpeed<0?-1:1);
  const nx=car.position.x-Math.sin(car.rotation.y)*carSpeed*dt,nz=car.position.z-Math.cos(car.rotation.y)*carSpeed*dt;
  let blocked=false;for(const b of blockers){const dx=nx-b.x,dz=nz-b.z,dist=Math.hypot(dx,dz),min=b.r+3.2;if(dist<min){blocked=true;carSpeed=0;}}
  if(!blocked){car.position.x=THREE.MathUtils.clamp(nx,-365,365);car.position.z=THREE.MathUtils.clamp(nz,-365,365);}
  car.position.y=heightAt(car.position.x,car.position.z);wheels.forEach(w=>w.rotation.x-=carSpeed*dt*1.5);
  activeX=car.position.x;activeZ=car.position.z;activeY=car.position.y;
 }
 const x=activeX,z=activeZ;
 const followYaw=driving?car.rotation.y:yaw;
 const target=new THREE.Vector3(activeX+Math.sin(followYaw)*22,activeY+(driving?12:10)+pitch*10,activeZ+Math.cos(followYaw)*22);
 camera.position.lerp(target,.09);camera.lookAt(activeX,activeY+(driving?1.8:2.4),activeZ);
 if(Math.hypot(x-cliffX,z-cliffZ)<75)zone.textContent='月亮瀑布・星光之門';
 else if(Math.hypot(x+245,z+235)<85)zone.textContent='月霧花園';
 else if(Math.hypot(x-275,z-225)<85)zone.textContent='水晶洞窟';
 else if(Math.hypot(x+255,z-235)<85)zone.textContent='古代星門遺跡';
 else if(Math.hypot(x-275,z+235)<85)zone.textContent='雲海港灣';
 else zone.textContent='夢境草原・月光之境';
 // Local atmosphere animation: slow fog drift, gentle butterfly wingbeats and cave motes.
 gardenFog.children.forEach((o,i)=>{if(o.userData.baseY!==undefined){o.position.x+=Math.sin(worldClock.elapsedTime*.18+i)*dt*.7;o.position.y=o.userData.baseY+Math.sin(worldClock.elapsedTime*.45+i)*.45;}});
 butterflies.forEach((b,i)=>{const u=b.userData;b.position.x=u.origin.x+Math.sin(worldClock.elapsedTime*.42+u.phase)*5;b.position.y=u.origin.y+Math.sin(worldClock.elapsedTime*.9+u.phase)*1.8;b.position.z=u.origin.z+Math.cos(worldClock.elapsedTime*.35+u.phase)*4;u.left.rotation.z=Math.sin(worldClock.elapsedTime*11+u.phase)*.65;u.right.rotation.z=-Math.sin(worldClock.elapsedTime*11+u.phase)*.65;});
 caveDust.forEach((m,i)=>{m.position.y=caveY+4+((worldClock.elapsedTime*1.2+i*2.3)%20);m.position.x+=Math.sin(worldClock.elapsedTime*.4+i)*dt*.22;});
 const inGarden=Math.hypot(x+245,z+235)<92,inCave=Math.hypot(x-275,z-225)<72;
 gardenGlow.intensity=inGarden?1.65:.25;caveShade.intensity=inCave?.95:.18;
 scene.fog.density=inCave?.0022:(inGarden?.00155:.00072);
 stars.rotation.y+=dt*.0008;falls.forEach((f,i)=>{const a=f.geometry.attributes.position;for(let k=0;k<a.count;k++){const x=a.getX(k),y=a.getY(k),z=a.getZ(k);a.setX(k,x+Math.sin(worldClock.elapsedTime*2.2+y*.22+i)*.018);a.setZ(k,z+Math.sin(worldClock.elapsedTime*2.8+y*.3+i)*.025);}a.needsUpdate=true;});renderer.render(scene,camera);
}
animate();document.querySelector('#loading').style.display='none';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
