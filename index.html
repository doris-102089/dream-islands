<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>夢境群島 Dream Islands</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcf4;font-family:system-ui,"Noto Sans TC",sans-serif}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#cover{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(35,89,133,.18),rgba(17,54,94,.55));color:white;text-align:center;padding:24px;z-index:5}
.panel{width:min(92vw,440px);padding:28px 22px;border:1px solid rgba(255,255,255,.55);border-radius:26px;background:rgba(20,53,84,.48);backdrop-filter:blur(12px);box-shadow:0 18px 60px #16486a55}
h1{font-size:clamp(30px,7vw,48px);margin:0 0 8px;letter-spacing:2px}.sub{opacity:.92;line-height:1.7;margin:0 0 22px}
button{border:0;border-radius:999px;padding:13px 25px;font-size:17px;font-weight:700;color:#24516d;background:linear-gradient(135deg,#fff4c8,#fff);box-shadow:0 5px 18px #123b5b55;cursor:pointer}
#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#fff;background:#183d5c88;border:1px solid #ffffff55;border-radius:18px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none}
#controls{position:fixed;inset:auto 0 18px;display:none;justify-content:space-between;align-items:end;padding:0 18px;z-index:3;pointer-events:none}
.pad{width:122px;height:122px;border-radius:50%;background:#ffffff30;border:1px solid #ffffff80;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff9;left:36px;top:36px}
#jump{pointer-events:auto;width:76px;height:76px;padding:0;background:#fff9;color:#28516b}
#status{position:fixed;right:12px;top:12px;color:#fff;background:#183d5c88;padding:7px 11px;border-radius:15px;font-size:12px;z-index:2}
@media(orientation:portrait){#hint:after{content:" · 橫向遊玩更舒服"}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hint">拖曳畫面轉動視角 · WASD 移動 · 空白鍵跳躍</div>
<div id="status">夢境群島 · 初始島</div>
<div id="controls"><div class="pad" id="pad"><div id="stick"></div></div><button id="jump">跳躍</button></div>
<div id="cover"><div class="panel"><h1>夢境群島</h1><p class="sub">穿過雲海，探索漂浮在天空中的秘密島嶼。<br>使用滑鼠或手指轉動視角，開始你的旅程吧！</p><button id="start">開始探索 ✨</button><p style="font-size:12px;opacity:.8;margin:16px 0 0">首次載入需要網路連線</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(()=> {
const cover=document.getElementById('cover'), start=document.getElementById('start'), status=document.getElementById('status');
let scene,camera,renderer,player,clock,started=false,yaw=0,pitch=.25,drag=false,lastX=0,lastY=0,velocityY=0,onGround=true;
const keys={}; let moveTouch={x:0,y:0};
function mat(color,roughness=1){return new THREE.MeshStandardMaterial({color,roughness})}
function addIsland(x,z,sx,sz,color,topY=0){
 const top=new THREE.Mesh(new THREE.CylinderGeometry(sx*.82,sx,1.2,9),mat(color));top.position.set(x,topY-.65,z);scene.add(top);
 const grass=new THREE.Mesh(new THREE.CylinderGeometry(sx*.82,sx*.88,.22,9),mat(0x91cfa0));grass.position.set(x,topY+.02,z);scene.add(grass);
 for(let i=0;i<7;i++){let a=i*Math.PI*2/7;let rock=new THREE.Mesh(new THREE.ConeGeometry(.55+Math.random()*.3,1.5+Math.random(),6),mat(0x8c9eb0));rock.position.set(x+Math.cos(a)*sx*.65,topY-1.4-Math.random()*.5,z+Math.sin(a)*sz*.65);rock.rotation.z=(Math.random()-.5)*.4;scene.add(rock)}
 return {x,z,sx,sz,y:topY};
}
function tree(x,z,y,scale=1){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12*scale,.18*scale,1.2*scale,6),mat(0x89664e));trunk.position.set(x,y+.65*scale,z);scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(.68*scale,8,7),mat(0x5eaa88));crown.position.set(x,y+1.45*scale,z);scene.add(crown);
}
function cloud(x,y,z,s=1){
 const g=new THREE.Group(); for(let i=0;i<5;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.7*s,10,8),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.78}));m.position.set((i-2)*.55*s,Math.sin(i*1.7)*.15*s,Math.cos(i)*.15*s);g.add(m)}g.position.set(x,y,z);scene.add(g);
}
function crystal(x,y,z,c=0x8cecff){
 const m=new THREE.Mesh(new THREE.OctahedronGeometry(.45),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.22,roughness:.25}));m.position.set(x,y,z);m.rotation.y=.5;scene.add(m);
}
function init(){
 if(typeof THREE==='undefined'){start.textContent='載入失敗，請確認網路後重新整理';return}
 scene=new THREE.Scene();scene.background=new THREE.Color(0x9eddf5);scene.fog=new THREE.Fog(0x9eddf5,24,75);
 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,150);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xe8f8ff,0x7896a3,2));
 const sun=new THREE.DirectionalLight(0xfff3d7,2.2);sun.position.set(-8,16,9);sun.castShadow=true;scene.add(sun);
 const water=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x77cbe6));water.rotation.x=-Math.PI/2;water.position.y=-10;scene.add(water);
 // Main island and nearby islands
 const main=addIsland(0,0,8,7,0x9acb9b,0);
 addIsland(-19,-13,5,5,0x9bc7a2,-1.5);addIsland(21,-17,6,5,0xc6b8df,-.8);addIsland(18,16,5,6,0xe6c4a4,-1.8);addIsland(-22,18,6,5,0x9bcbd0,-1.2);
 for(let i=0;i<13;i++){let a=i*2.4;tree(Math.cos(a)*(2.5+Math.random()*4),Math.sin(a)*(2+Math.random()*3),.15,.65+Math.random()*.6)}
 for(let i=0;i<18;i++){let a=i*2.4;let flower=new THREE.Mesh(new THREE.SphereGeometry(.12,6,6),mat([0xffe7a6,0xffc7db,0xd8caff][i%3]));flower.position.set(Math.cos(a)* (1.5+Math.random()*5),.28,Math.sin(a)*(1.5+Math.random()*4));scene.add(flower)}
 crystal(-3,.8,-2);crystal(3,.7,2,0xffd78e);crystal(1,.8,-4,0xd5b8ff);
 // Portal
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.25,.12,10,36),new THREE.MeshStandardMaterial({color:0x8deaff,emissive:0x48bde8,emissiveIntensity:.7}));ring.position.set(0,1.5,-5);scene.add(ring);
 const portalBase=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.9,.25,24),mat(0x7c9eae));portalBase.position.set(0,.16,-5);scene.add(portalBase);
 // distant floating rock silhouettes
 for(let i=0;i<20;i++){let a=i*Math.PI*2/20,r=38+Math.random()*8;let c=new THREE.Mesh(new THREE.SphereGeometry(1.3+Math.random()*2,8,6),mat(0xc1dce5));c.position.set(Math.cos(a)*r,-1+Math.random()*5,Math.sin(a)*r);scene.add(c)}
 for(let i=0;i<11;i++)cloud(-35+i*7,12+(i%3)*2,-32-(i%4)*7,.9+Math.random()*.8);
 // simple animated stick adventurer
 player=new THREE.Group();const skin=mat(0xffdfc4),cloth=mat(0x557eaa),dark=mat(0x344b67);
 let head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),skin);head.position.y=1.85;player.add(head);
 let body=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.75,4,8),cloth);body.position.y=1.05;player.add(body);
 const limbGeo=new THREE.CapsuleGeometry(.09,.52,3,6);
 const armL=new THREE.Mesh(limbGeo,skin),armR=new THREE.Mesh(limbGeo,skin);armL.position.set(-.34,1.15,0);armR.position.set(.34,1.15,0);player.add(armL,armR);
 const legL=new THREE.Mesh(limbGeo,dark),legR=new THREE.Mesh(limbGeo,dark);legL.position.set(-.14,.42,0);legR.position.set(.14,.42,0);player.add(legL,legR);
 player.userData={armL,armR,legL,legR};player.position.set(0,0,3);scene.add(player);
 clock=new THREE.Clock();
 animate();
}
function animate(){
 requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 if(started&&player){
  let forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-moveTouch.y;
  let side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+moveTouch.x;
  let moving=Math.abs(forward)+Math.abs(side)>.08;
  let dir=new THREE.Vector3(side,0,-forward);if(dir.length()>1)dir.normalize();
  dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  player.position.addScaledVector(dir,dt*5);
  if(moving){player.rotation.y=Math.atan2(dir.x,dir.z);let swing=Math.sin(t*10)*.65;player.userData.armL.rotation.x=swing;player.userData.armR.rotation.x=-swing;player.userData.legL.rotation.x=-swing;player.userData.legR.rotation.x=swing}
  else {Object.values(player.userData).forEach(o=>o.rotation.x*=.75)}
  velocityY-=12*dt;player.position.y+=velocityY*dt;if(player.position.y<=0){player.position.y=0;velocityY=0;onGround=true}
  if(keys.Space&&onGround){velocityY=6;onGround=false}
  const target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z);
  let dist=9,cp=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*dist*cp,target.y+Math.sin(pitch)*dist+2,target.z+Math.cos(yaw)*dist*cp);camera.lookAt(target);
 }
 // gentle portal and clouds motion
 scene.children.forEach(o=>{if(o.geometry&&o.geometry.type==='TorusGeometry')o.rotation.y=t*.5});
 renderer.render(scene,camera);
}
start.addEventListener('click',()=>{if(!renderer){init()}if(renderer){started=true;cover.style.display='none';document.getElementById('controls').style.display='flex';}});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
window.addEventListener('keyup',e=>keys[e.code]=false);
const canvasArea=document.getElementById('game');
canvasArea.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvasArea.setPointerCapture(e.pointerId)});
canvasArea.addEventListener('pointermove',e=>{if(!drag||!started)return;yaw-=(e.clientX-lastX)*.006;pitch=Math.max(-.15,Math.min(.85,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});
canvasArea.addEventListener('pointerup',()=>drag=false);canvasArea.addEventListener('pointercancel',()=>drag=false);
document.getElementById('jump').addEventListener('click',()=>{if(onGround){velocityY=6;onGround=false}});
const pad=document.getElementById('pad'),stick=document.getElementById('stick');let padRect;
pad.addEventListener('pointerdown',e=>{padRect=pad.getBoundingClientRect();pad.setPointerCapture(e.pointerId);movePad(e)});
pad.addEventListener('pointermove',e=>{if(e.buttons)movePad(e)});
function movePad(e){let cx=padRect.left+padRect.width/2,cy=padRect.top+padRect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=38;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;moveTouch={x:dx/max,y:dy/max}}
function resetPad(){moveTouch={x:0,y:0};stick.style.transform='translate(0,0)'}pad.addEventListener('pointerup',resetPad);pad.addEventListener('pointercancel',resetPad);
window.addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
})();
</script>
</body></html>
